name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Restore and save Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          cache-key: turbo-linux-${{ matrix.task }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-linux-${{ matrix.task }}-${{ github.ref_name }}-
            turbo-linux-${{ matrix.task }}-main-
            turbo-linux-${{ matrix.task }}-

      - name: Run ${{ matrix.task }}
        uses: ./.github/actions/turbo-run
        with:
          task: ${{ matrix.task }}
          base-branch: origin/main
          event-type: ${{ github.event_name }}
