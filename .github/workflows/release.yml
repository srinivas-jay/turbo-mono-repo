name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Detect publishable packages
        id: package-check
        shell: bash
        run: |
          output="$(pnpm lerna ls --all 2>&1)"
          echo "$output"
          if echo "$output" | grep -q "found 0 packages"; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore and save Turbo cache
        if: steps.package-check.outputs.has_packages == 'true'
        uses: ./.github/actions/turbo-cache
        with:
          cache-key: turbo-linux-release-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-linux-release-${{ github.ref_name }}-
            turbo-linux-build-${{ github.ref_name }}-
            turbo-linux-build-main-
            turbo-linux-build-

      - name: Version packages from conventional commits
        if: steps.package-check.outputs.has_packages == 'true'
        uses: ./.github/actions/version-management

      - name: Build packages
        if: steps.package-check.outputs.has_packages == 'true'
        uses: ./.github/actions/turbo-run
        with:
          task: build
          base-branch: origin/main
          event-type: workflow_dispatch

      - name: Publish packages
        if: steps.package-check.outputs.has_packages == 'true'
        uses: ./.github/actions/publish-packages
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip release when no packages exist
        if: steps.package-check.outputs.has_packages != 'true'
        shell: bash
        run: echo "No workspace packages were found. Skipping version and publish steps."
